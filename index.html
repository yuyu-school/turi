// ── Audio ─────────────────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audio;
try { audio = new AudioCtx(); } catch(e) {}

function beep(freq, dur, type='square', vol=0.15) {
  if (!audio) return;
  try {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.connect(gain); gain.connect(audio.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audio.currentTime);
    gain.gain.setValueAtTime(vol, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    osc.start(audio.currentTime);
    osc.stop(audio.currentTime + dur);
  } catch(e) {}
}

function soundCatch() {
  if (!audio) return;
  try {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.connect(gain); gain.connect(audio.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(600, audio.currentTime);
    osc.frequency.linearRampToValueAtTime(1200, audio.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.15);
    osc.start(audio.currentTime);
    osc.stop(audio.currentTime + 0.15);
  } catch(e) {}
}
function soundMultiCatch(n) {
  if (!audio) return;
  try {
    const baseNotes = [523, 659, 784, 1047]; // C5, E5, G5, C6
    const count = Math.min(n, baseNotes.length);
    for (let i = 0; i < count; i++) {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.connect(gain); gain.connect(audio.destination);
      osc.type = 'square';
      const t = audio.currentTime + i * 0.1;
      osc.frequency.setValueAtTime(baseNotes[i], t);
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      osc.start(t);
      osc.stop(t + 0.2);
    }
    // Add a shimmer/sparkle overlay for big combos (3+)
    if (n >= 3) {
      const osc2 = audio.createOscillator();
      const gain2 = audio.createGain();
      osc2.connect(gain2); gain2.connect(audio.destination);
      osc2.type = 'sine';
      const t2 = audio.currentTime + count * 0.1;
      osc2.frequency.setValueAtTime(1568, t2); // G6
      osc2.frequency.linearRampToValueAtTime(2093, t2 + 0.3); // C7
      gain2.gain.setValueAtTime(0.12, t2);
      gain2.gain.exponentialRampToValueAtTime(0.001, t2 + 0.4);
      osc2.start(t2);
      osc2.stop(t2 + 0.4);
    }
  } catch(e) {}
}
function soundCut() {
  if (!audio) return;
  try {
    // "Buchi" snap - noise-like burst
    const osc1 = audio.createOscillator();
    const gain1 = audio.createGain();
    osc1.connect(gain1); gain1.connect(audio.destination);
    osc1.type = 'sawtooth';
    osc1.frequency.setValueAtTime(300, audio.currentTime);
    osc1.frequency.linearRampToValueAtTime(50, audio.currentTime + 0.15);
    gain1.gain.setValueAtTime(0.3, audio.currentTime);
    gain1.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.15);
    osc1.start(audio.currentTime);
    osc1.stop(audio.currentTime + 0.15);

    // "Gaan" - descending dramatic tone
    const osc2 = audio.createOscillator();
    const gain2 = audio.createGain();
    osc2.connect(gain2); gain2.connect(audio.destination);
    osc2.type = 'square';
    osc2.frequency.setValueAtTime(440, audio.currentTime + 0.1);
    osc2.frequency.linearRampToValueAtTime(110, audio.currentTime + 0.5);
    gain2.gain.setValueAtTime(0.2, audio.currentTime + 0.1);
    gain2.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.5);
    osc2.start(audio.currentTime + 0.1);
    osc2.stop(audio.currentTime + 0.5);

    // Low rumble
    const osc3 = audio.createOscillator();
    const gain3 = audio.createGain();
    osc3.connect(gain3); gain3.connect(audio.destination);
    osc3.type = 'triangle';
    osc3.frequency.setValueAtTime(80, audio.currentTime + 0.1);
    gain3.gain.setValueAtTime(0.15, audio.currentTime + 0.1);
    gain3.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.6);
    osc3.start(audio.currentTime + 0.1);
    osc3.stop(audio.currentTime + 0.6);
  } catch(e) {}
}

  [440,330,220,110].forEach((f,i)=>setTimeout(()=>beep(f,0.3,'square',0.15),i*200));

}

  if (game.state === 'title') {
    startGame('1p');
  } else if (game.state === 'result') {
    resetGame();
  }
}, { passive: false });

function pollGamepads() {
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  let gpIdx = 0;
  for (let i = 0; i < gps.length && gpIdx < 2; i++) {
    const gp = gps[i];
    if (!gp) continue;
    const state = gpState[gpIdx];

    // Button press events (for hook toggle & menu navigation)
    for (let b = 0; b < gp.buttons.length; b++) {
      const pressed = gp.buttons[b].pressed;
      if (pressed && !state.prev[b]) {
        handleGamepadPress(gpIdx, b);
      }
      state.prev[b] = pressed;
    }

    // Continuous axis / d-pad movement in play state
    if (game.state === 'play') {
      const axisX = gp.axes[0] || 0;
      // Skip movement for AI-controlled player 2 in 1P mode
      const isManagedByAI = (game.mode === '1p' && gpIdx === 1);
      if (!isManagedByAI) {
        const p = players[gpIdx];
        if (p && p.stunTimer <= 0) {
          const [minX, maxX] = [40, W - 40];
          if (axisX < -0.3 || (gp.buttons[14] && gp.buttons[14].pressed)) {
            p.rodX = Math.max(minX, p.rodX - ROD_SPEED * dt);
          }
          if (axisX >  0.3 || (gp.buttons[15] && gp.buttons[15].pressed)) {
            p.rodX = Math.min(maxX, p.rodX + ROD_SPEED * dt);
          }
        }
      }
    }

    gpIdx++;
  }
}

function handleKeyPress(code) {
  if (game.state === 'title') {
    if (code === 'KeyS') { startGame('1p'); return; }
    // Any other key → 2P mode
    startGame('2p');
    return;
  }
  if (game.state === 'result') { if (code === 'Space') { resetGame(); } return; }
  if (game.state === 'play') {
    if (code === 'KeyS') toggleHook(0);
    // In 2P mode, K controls player 2; in 1P mode K still works as 2P override
    if (code === 'KeyK') toggleHook(1);
  }
}

function handleGamepadPress(playerIdx, buttonIdx) {
  if (game.state === 'title') { startGame('2p'); return; }
  if (game.state === 'result') { return; }
  if (game.state === 'play') {
    // In 1P mode, AI controls player 2 — don't let gamepad 2 override
    if (game.mode === '1p' && playerIdx === 1) return;
    toggleHook(playerIdx);
  }
}

// ── Pixel Drawing Helpers ─────────────────────────────────────
function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(x), Math.floor(y), w, h);
}

// Draw an 8×8 sprite from a pixel array (16 chars hex, each nibble = palette index)
function drawSprite(data, palette, x, y, scale=2) {
  const s = scale;
  for (let row = 0; row < data.length; row++) {
    for (let col = 0; col < data[row].length; col++) {
      const c = data[row][col];
      if (c === '.' || c === ' ') continue;
      ctx.fillStyle = palette[c] || '#fff';
      ctx.fillRect(Math.floor(x + col*s), Math.floor(y + row*s), s, s);
    }
  }
}

function drawPixelText(text, x, y, scale=2, color='#fff', align='left') {
  const chars = text.toUpperCase().split('');
  const charW = (5 + 1) * scale; // 5px + 1 gap
  const totalW = chars.length * charW;
  let startX = x;
  if (align === 'center') startX = x - totalW / 2;
  if (align === 'right') startX = x - totalW;

  chars.forEach((ch, i) => {
    const data = PFONT[ch];
    if (!data) return;
    const cx = startX + i * charW;
    data.forEach((row, ry) => {
      for (let bx = 0; bx < row.length; bx++) {
        if (row[bx] === '1') {
          ctx.fillStyle = color;
          ctx.fillRect(Math.floor(cx + bx*scale), Math.floor(y + ry*scale), scale, scale);
        }
      }
    });
  });
}

// ── Game Objects ──────────────────────────────────────────────
function createFish(x, y, type) {
  const dir = Math.random() < 0.5 ? 1 : -1;
  const speed = 0.4 + Math.random() * 0.6;
  return {
    id: Math.random(),
    type,        // 'fish','squid','ruby'
    x, y,
    vx: dir * speed * (type === 'ruby' ? 0.2 : 1),
    vy: 0,
    wobbleT: Math.random() * Math.PI * 2,
    pulseT: 0,
    caught: false,
    caughtBy: -1,
    scattered: false,
    scatterVx: 0,
    scatterVy: 0,
    alive: true,
    frame: 0,
    variant: Math.random() < 0.5 ? 0 : 1,
  };
}

function spawnWave() {
  const aliveCount = creatures.filter(f => f.alive && !f.caught).length;
  if (aliveCount >= maxCreatures) return;

  const capacity = maxCreatures - aliveCount;
  const baseWaveSize = Math.floor(1 + elapsed / 30);
  const waveSize = Math.min(baseWaveSize + 2, capacity);
  if (waveSize <= 0) return;

  for (let i = 0; i < waveSize; i++) {
    const roll = Math.random();
    let type;
    if (roll < 0.30) type = 'squid';
    else type = 'fish';

    // Spawn from ground with upward movement
    const x = Math.random() * (W - 80) + 40;
    const y = GROUND_TOP - 40;
    const f = createFish(x, y, type);

    // Small random horizontal drift
    f.vx = (Math.random() - 0.5) * 0.78;

    // Initial upward velocity based on type
    if (type === 'fish') {
      f.vy = -(1.3 + Math.random() * 0.8775);
    } else if (type === 'squid') {
      f.vy = -(1.625 + Math.random() * 1.3);
    }

    creatures.push(f);
  }
}

function createPlayer(idx) {
  const rx = idx === 0 ? ROD_P1.x : ROD_P2.x;
  const ry = idx === 0 ? ROD_P1.y : ROD_P2.y;
  return {
    idx,
    rodX: rx,
    rodY: ry,
    hookX: rx,
    hookY: ry + 10,
    hookDown: true,
    score: 0,
    maxCombo: 0,
    caughtFish: [],
    lineCut: false,
    cutFlash: 0,
    stunTimer: 0,
  };
}

// ── Hook mechanics ────────────────────────────────────────────
function toggleHook(idx) {
  const p = players[idx];
  if (p.stunTimer > 0) return;
  if (p.lineCut) {
    // re-deploy after cut
    p.lineCut = false;
    p.hookDown = true;
    p.hookY = p.rodY + 10;
    p.caughtFish = [];
    soundReel();
    return;
  }
  p.hookDown = !p.hookDown;
  if (!p.hookDown) {
    soundReel();
  }
}

function hookWeight(p) {
  return p.caughtFish.reduce((s, f) => {
    if (f.type === 'fish') return s + 1;
    if (f.type === 'squid') return s + 10;
    if (f.type === 'ruby') return s + 100;
    return s;
  }, 0);
}

function hookAscentSpeed(p) {
  const w = hookWeight(p);
  return Math.max(MIN_ASCENT, BASE_ASCENT - w * WEIGHT_FACTOR);
}
function hookDescentSpeed(p) {
  const w = hookWeight(p);
  return Math.min(MAX_DESCENT, BASE_DESCENT + w * WEIGHT_FACTOR);
}

function updateHook(p) {
  if (p.lineCut) return;

  if (p.hookDown) {
    // Descending
    p.hookY += hookDescentSpeed(p) * dt;
    if (p.hookY >= GROUND_TOP - 10) {
      p.hookY = GROUND_TOP - 10;
      p.hookDown = false; // auto switch to ascending
    }
  } else {
    // Ascending
    p.hookY -= hookAscentSpeed(p) * dt;
    if (p.hookY <= p.rodY + 10) {
      p.hookY = p.rodY + 10;
      // Score fish!
      if (p.caughtFish.length > 0) {
        const combo = p.caughtFish.length;
        if (combo > p.maxCombo) p.maxCombo = combo;
        const gained = p.caughtFish.reduce((s, f) => s + fishScore(f.type), 0);
        p.score += gained;
        p.caughtFish.forEach(f => { f.alive = false; });
        p.caughtFish = [];
        soundMultiCatch(combo);
        if (combo >= 3) {
          // Bonus flash effect (visual only)
        }
      }
      // p.hookDown = true; // auto switch to descending — REMOVED: hook now stops at surface
    }
  }

  // Hook X follows rod tip (offset by hand direction)
  const isP1 = p.idx === 0;
  const dir = isP1 ? 1 : -1;
  p.hookX = p.rodX + dir * 14;

  // Catch fish
  for (const f of creatures) {
    if (!f.alive || f.caught) continue;
    const dx = f.x - p.hookX;
    const dy = f.y - p.hookY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const hitR = f.type === 'ruby' ? 34 : f.type === 'squid' ? 38 : 30;
    if (dist < hitR) {
      f.caught = true;
      f.caughtBy = p.idx;
      p.caughtFish.push(f);
      soundCatch();
    }
  }
}

function fishScore(type) {
  if (type === 'ruby') return 100;
  if (type === 'squid') return 10;
  return 1;
}

// ── AI for 1P mode ───────────────────────────────────────────
function resetAiTimer() {
  // Toggle interval: 2–4 seconds expressed in frames (@ ~60fps)
  aiToggleInterval = Math.floor((2 + Math.random() * 2) * 60);
  aiTimer = aiToggleInterval;
}

function updateAI() {
  const p = players[1];

  // Re-deploy after line cut
  if (p.lineCut) {
    resetAiTimer();
    toggleHook(1); // re-deploy
    return;
  }

  // Slow horizontal drift toward nearest uncaught fish
  const targets = creatures.filter(f => f.alive && !f.caught);
  if (targets.length > 0) {
    // Find closest fish to current hookX
    let nearest = targets[0];
    let nearestDist = Math.abs(targets[0].x - p.rodX);
    for (const f of targets) {
      const d = Math.abs(f.x - p.rodX);
      if (d < nearestDist) { nearestDist = d; nearest = f; }
    }
    const minX = 40;
    const maxX = W - 40;
    const aiSpeed = ROD_SPEED * 0.4; // slower than player
    if (nearest.x < p.rodX - 10) p.rodX = Math.max(minX, p.rodX - aiSpeed * dt);
    else if (nearest.x > p.rodX + 10) p.rodX = Math.min(maxX, p.rodX + aiSpeed * dt);
  }

  // Hook toggle on timer
  aiTimer--;
  if (aiTimer <= 0) {
    toggleHook(1);
    resetAiTimer();
  }
}

// ── Line cut by crab ──────────────────────────────────────────
function checkCrabCutLines() {
  for (const crab of crabs) {
    if (!crab.alive) continue;
    for (const p of players) {
      if (p.lineCut) continue;
      // Line is from rodY to hookY at hookX
      const lx = p.hookX;
      const ly1 = p.rodY;
      const ly2 = p.hookY;
      // Crab hitbox
      if (Math.abs(crab.x - lx) < 22 &&
          crab.y + 10 >= ly1 && crab.y <= ly2) {
        cutLine(p);
        crab.stunTimer = 120;
        // Don't kill crab; just keep going
      }
    }
  }
}

function cutLine(p) {
  p.lineCut = true;
  p.hookDown = false;
  p.cutFlash = 30;
  p.stunTimer = 120;
  soundCut();

  // Scatter fish
  p.caughtFish.forEach(f => {
    f.caught = false;
    f.caughtBy = -1;
    f.scattered = true;
    if (f.type === 'ruby') {
      // Fall straight down
      f.vx = 0;
      f.vy = 3;
    } else if (f.type === 'squid') {
      // Squid jet away
      const dir = Math.random() < 0.5 ? -1 : 1;
      f.vx = dir * (2 + Math.random() * 2);
      f.vy = -2 - Math.random() * 2;
      f.pulseT = 0;
    } else {
      // Fish scatter
      f.vx = (Math.random() - 0.5) * 4;
      f.vy = (Math.random() - 0.5) * 4;
    }
  });
  p.caughtFish = [];
}

// ── Update creatures ──────────────────────────────────────────
function updateCreatures() {
  for (const f of creatures) {
    if (!f.alive) continue;
    if (f.caught) {
      // Follow hook
      const p = players[f.caughtBy];
      if (!p || p.lineCut) {
        f.caught = false;
        f.caughtBy = -1;
      } else {
        // Stack fish vertically along the line, going upward from the hook
        const offset = p.caughtFish.indexOf(f);
        f.x = p.hookX;
        f.y = Math.max(WATER_TOP + 10, p.hookY - (offset + 1) * 20);
      }
      continue;
    }

    f.frame++;
    f.wobbleT += 0.05;
    f.pulseT += 0.08;

    if (f.scattered) {
      // Scatter physics
      if (f.type === 'ruby') {
        f.vy += 0.1; // gravity
        f.vy = Math.min(f.vy, 5);
        f.y += f.vy;
        if (f.y >= GROUND_TOP - 8) {
          f.y = GROUND_TOP - 8;
          f.vy = 0;
          // Stay on ground, re-catchable (not scattered forever)
          f.scattered = false;
          f.vx = 0;
          f.vy = 0;
        }
        // Bounce off walls
        if (f.x <= 0) {
          f.x = 0;
          f.vx = Math.abs(f.vx);
        }
        if (f.x >= W) {
          f.x = W;
          f.vx = -Math.abs(f.vx);
        }
      } else if (f.type === 'squid') {
        // Pulse motion: burst then decelerate
        const pulse = Math.sin(f.pulseT) * 0.5;
        f.x += f.vx + pulse;
        f.y += f.vy;
        f.vx *= 0.97;
        f.vy *= 0.97;
        // Keep in water
        if (f.y < WATER_TOP + 5) { f.y = WATER_TOP + 5; f.vy = Math.abs(f.vy); }
        if (f.y > GROUND_TOP - 12) { f.y = GROUND_TOP - 12; f.vy = -Math.abs(f.vy); }
        // Bounce off walls instead of dying
        if (f.x <= 0) {
          f.x = 0;
          f.vx = Math.abs(f.vx);
        }
        if (f.x >= W) {
          f.x = W;
          f.vx = -Math.abs(f.vx);
        }
        if (Math.abs(f.vx) < 0.1 && Math.abs(f.vy) < 0.1) f.scattered = false;
      } else {
        f.x += f.vx;
        f.y += f.vy;
        f.vy += 0.05;
        if (f.y < WATER_TOP + 5) { f.y = WATER_TOP + 5; f.vy = Math.abs(f.vy) * 0.5; }
        if (f.y > GROUND_TOP - 10) {
          f.y = GROUND_TOP - 10;
          f.vy = -Math.abs(f.vy) * 0.4;
          f.vx *= 0.95;
        }
        // Bounce off walls instead of dying
        if (f.x <= 0) {
          f.x = 0;
          f.vx = Math.abs(f.vx);
        }
        if (f.x >= W) {
          f.x = W;
          f.vx = -Math.abs(f.vx);
        }
        if (Math.abs(f.vx) < 0.05 && Math.abs(f.vy) < 0.05) f.scattered = false;
      }
      continue;
    }

    // Normal movement
    if (f.type === 'fish') {
      f.x += f.vx;
      f.y += f.vy;
      f.y += Math.sin(f.wobbleT) * 0.3;

      // Bounce at water top
      if (f.y <= WATER_TOP + 10) {
        f.y = WATER_TOP + 10;
        f.vy = Math.abs(f.vy) * 0.5;
      }

      // Bounce at ground
      if (f.y >= GROUND_TOP - 30) {
        f.y = GROUND_TOP - 30;
        f.vy = -Math.abs(f.vy) * 0.5;
      }

      // Random drift to vy for natural swimming (slight upward bias)
      f.vy += (Math.random() - 0.55) * 0.02;

      // Bounce off walls instead of dying
      if (f.x <= 0) {
        f.x = 0;
        f.vx = Math.abs(f.vx);
      }
      if (f.x >= W) {
        f.x = W;
        f.vx = -Math.abs(f.vx);
      }
    } else if (f.type === 'squid') {
      const pulse = Math.abs(Math.sin(f.pulseT));
      f.x += f.vx * (0.325 + pulse * 0.455);
      f.y += f.vy;
      f.y += Math.sin(f.wobbleT * 0.5) * 0.15;
      f.vy += (Math.random() - 0.55) * 0.03;

      // Bounce at water top
      if (f.y <= WATER_TOP + 10) {
        f.y = WATER_TOP + 10;
        f.vy = Math.abs(f.vy) * 0.8;
      }

      // Bounce at ground
      if (f.y >= GROUND_TOP - 30) {
        f.y = GROUND_TOP - 30;
        f.vy = -Math.abs(f.vy) * 0.8;
      }

      // Bounce off walls instead of dying
      if (f.x <= 0) {
        f.x = 0;
        f.vx = Math.abs(f.vx);
      }
      if (f.x >= W) {
        f.x = W;
        f.vx = -Math.abs(f.vx);
      }
    } else if (f.type === 'ruby') {
      // Ruby stays fixed on the ground, no movement
    }
  }
  // Remove dead
  creatures = creatures.filter(f => f.alive);
}

function updateCrabs() {
  for (const crab of crabs) {
    if (!crab.alive) continue;
    if (crab.stunTimer > 0) {
      crab.stunTimer--;
      continue;
    }
    crab.x += crab.vx;
    // Bounce off screen edges instead of dying
    if (crab.x <= 0) {
      crab.x = 0;
      crab.vx = Math.abs(crab.vx); // bounce right
    }
    if (crab.x >= W) {
      crab.x = W;
      crab.vx = -Math.abs(crab.vx); // bounce left
    }
  }
  crabs = crabs.filter(c => c.alive);
}

// ── Wave spawning ─────────────────────────────────────────────
let waveFrame = 0;

// ── Draw helpers ──────────────────────────────────────────────
function drawWater(t) {
  // Background water
  ctx.fillStyle = C.waterDeep;
  ctx.fillRect(0, WATER_TOP, W, GROUND_TOP - WATER_TOP);

  // Wave lines
  for (let wy = 0; wy < 5; wy++) {
    const waveY = WATER_TOP + 8 + wy * 25 + Math.sin(t * 0.02 + wy) * 3;
    ctx.fillStyle = wy === 0 ? C.waterLight : C.water;
    ctx.fillRect(0, waveY, W, 2);
    // Little wave pixels
    for (let wx = 0; wx < W; wx += 16) {
      const wh = Math.sin(t * 0.03 + wx * 0.04 + wy) * 3;
      ctx.fillRect(wx, waveY + wh, 8, 2);
    }
  }
}

function drawGround() {
  // Main ground
  ctx.fillStyle = C.ground;
  ctx.fillRect(0, GROUND_TOP, W, H - GROUND_TOP);

  // Sandy top strip
  ctx.fillStyle = C.sand;
  ctx.fillRect(0, GROUND_TOP, W, 6);

  // Pixel texture
  for (let gx = 0; gx < W; gx += 8) {
    ctx.fillStyle = Math.floor(gx / 8) % 2 === 0 ? C.groundLight : C.ground;
    ctx.fillRect(gx, GROUND_TOP + 6, 8, 4);
  }
  // Stones
  for (let sx = 30; sx < W; sx += 70) {
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(sx, GROUND_TOP + 8, 12, 6);
    ctx.fillStyle = '#6a4a2a';
    ctx.fillRect(sx+2, GROUND_TOP + 8, 4, 3);
  }
}

function drawSky() {
  ctx.fillStyle = C.sky;
  ctx.fillRect(0, 0, W, WATER_TOP);

  // Stars
  ctx.fillStyle = '#fff';
  const starSeed = [13,47,83,127,211,293,317,401,457,503];
  for (let i = 0; i < starSeed.length; i++) {
    const sx = (starSeed[i] * 97) % W;
    const sy = (starSeed[i] * 53) % (WATER_TOP - 10);
    ctx.fillRect(sx, sy, 2, 2);
  }

  // Water surface glitter
  ctx.fillStyle = '#3a6a8a';
  ctx.fillRect(0, WATER_TOP, W, 8);
  ctx.fillStyle = '#5a8aaa';
  ctx.fillRect(0, WATER_TOP, W, 3);
}

function drawRod(p) {
  const isP1 = p.idx === 0;
  const pal = isP1 ? PERSON1_PAL : PERSON2_PAL;
  const dir = isP1 ? 1 : -1;

  // Bobbing animation: slight sine-wave motion for water float effect
  const bobOffset = Math.sin(totalFrames * 0.03 + p.idx * Math.PI) * 2;

  // Draw raft at water surface BEFORE drawing person (so person appears on top of raft)
  const raftScale = 4;
  const raftW = 12 * raftScale; // 48px wide
  const raftH = 4 * raftScale;  // 16px tall
  const raftX = p.rodX - raftW / 2;
  const raftY = WATER_TOP - raftH / 2 + bobOffset; // centered on water line with bobbing
  drawSprite(RAFT_SPRITE, RAFT_PAL, raftX, raftY, raftScale);

  // Draw person sprite at scale 6 (48x48 pixels), centered above water line on the raft
  const personX = p.rodX - 24;
  const personY = WATER_TOP - 56 + bobOffset; // person bobs with raft
  // Skip drawing if stunned and in blink phase
  if (p.stunTimer > 0 && Math.floor(totalFrames / 10) % 2 === 0) {
    // Don't draw person during stun blink
  } else {
    drawSprite(PERSON_SPRITE, pal, personX, personY, 6);
  }

  // Rod stick extending from person's hand
  const handX = p.rodX + dir * 14;
  const handY = WATER_TOP - 20 + bobOffset; // hand bobs with person

  // Draw rod (vertical brown stick from hand downward)
  if (!(p.stunTimer > 0 && Math.floor(totalFrames / 10) % 2 === 0)) {
    ctx.fillStyle = '#8B5e3c';
    ctx.fillRect(handX - 2, handY, 4, 24);
    // Rod tip (lighter colour)
    ctx.fillStyle = '#c8a265';
    ctx.fillRect(handX - 2, handY + 22, 4, 5);
  }

  // Fishing line from rod tip down to hook
  const lineStartX = handX;
  const lineStartY = handY + 27;

  if (!p.lineCut) {
    ctx.fillStyle = p.cutFlash > 0 && p.cutFlash % 4 < 2 ? '#f00' : '#ddd';
    ctx.fillRect(handX - 1, lineStartY, 2, p.hookY - lineStartY);
  } else {
    // Cut line — short dangling piece
    if (p.cutFlash > 0) {
      ctx.fillStyle = '#f00';
      ctx.fillRect(handX - 1, lineStartY, 2, 20);
    }
  }
  if (p.cutFlash > 0) p.cutFlash--;

  // Draw STUN text when stunned
  if (p.stunTimer > 0) {
    if (Math.floor(totalFrames / 8) % 2 === 0) {
      drawPixelText('STUN!', p.rodX, WATER_TOP - 65, 2, '#ff0', 'center');
    }
  }
}

function drawHook(p) {
  if (p.lineCut) return;
  drawSprite(HOOK_SPRITE, HOOK_PAL, p.hookX - 4, p.hookY - 4, 2);
}

function drawFishCreature(f) {
  if (!f.alive) return;
  const dir = f.vx >= 0 ? 1 : -1;

  ctx.save();
  if (dir < 0) {
    // Flip horizontally
    ctx.translate(f.x + 20, 0);
    ctx.scale(-1, 1);
    ctx.translate(-f.x, 0);
  }

  if (f.type === 'fish') {
    const pal = f.variant === 0 ? FISH_PAL : FISH2_PAL;
    const spr = f.variant === 0 ? FISH_SPRITE : FISH2_SPRITE;
    drawSprite(spr, pal, f.x - 20, f.y - 20, 5);
  } else if (f.type === 'squid') {
    // Animate tentacles with pulse
    const extended = Math.abs(Math.sin(f.pulseT)) > 0.5;
    const spr = extended ? SQUID_SPRITE : [
      '..SSS...',
      '.SSSSS..',
      'SSSSSSS.',
      'SWSSSWS.',
      '.SSSSS..',
      '..SSS...',
      '...S....',
      '........',
    ];
    drawSprite(spr, SQUID_PAL, f.x - 20, f.y - 20, 5);
  } else if (f.type === 'ruby') {
    const shine = Math.floor(totalFrames / 10) % 3 === 0;
    const pal = shine ? RUBY_PAL_SHINE : RUBY_PAL_BASE;
    drawSprite(RUBY_SPRITE, pal, f.x - 20, f.y - 20, 5);
    // Sparkles
    if (shine) {
      ctx.fillStyle = '#fff';
      ctx.fillRect(f.x - 25, f.y - 25, 3, 3);
      ctx.fillRect(f.x + 22, f.y - 20, 3, 3);
      ctx.fillRect(f.x - 5, f.y - 35, 3, 3);
    }
  }
  ctx.restore();
}

function drawCrab(crab) {
  if (!crab.alive) return;
  // Skip drawing if stunned and in blink phase
  if (crab.stunTimer > 0 && Math.floor(totalFrames / 6) % 2 === 0) return;

  const dir = crab.vx >= 0 ? 1 : -1;
  ctx.save();
  if (dir < 0) {
    ctx.translate(crab.x + 20, 0);
    ctx.scale(-1, 1);
    ctx.translate(-crab.x, 0);
  }
  drawSprite(CRAB_SPRITE, CRAB_PAL, crab.x - 20, crab.y - 20, 5);
  // Animated claws
  const clawOffset = Math.floor(totalFrames / 15) % 2;
  ctx.fillStyle = C.crabRed;
  ctx.fillRect(crab.x - 45 + clawOffset * 2, crab.y - 25, 15, 10);
  ctx.fillRect(crab.x + 30 - clawOffset * 2, crab.y - 25, 15, 10);
  ctx.restore();
}

function drawUI() {
  // P1 score box (top-left)
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(4, 4, 200, 60);
  ctx.fillStyle = C.p1;

  drawPixelText('1P', 12, 12, 2, C.p1);

      drawPixelText('CUT!', tx, 8, 2, '#fff', 'center');

  }
}

  // Score legend
  const ly = 380;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(W/2 - 200, ly, 400, 80);

  // Draw fish icon
  drawSprite(FISH_SPRITE, FISH_PAL, W/2 - 190, ly + 10, 2);
  drawPixelText('1PT', W/2 - 155, ly + 14, 2, C.white);

  drawSprite(SQUID_SPRITE, SQUID_PAL, W/2 - 70, ly + 10, 2);
  drawPixelText('10PT', W/2 - 35, ly + 14, 2, C.white);

  drawSprite(RUBY_SPRITE, RUBY_PAL_BASE, W/2 + 70, ly + 10, 2);
  drawPixelText('100PT', W/2 + 105, ly + 14, 2, C.yellow);

  drawPixelText('CATCH COMBO FOR BONUS!', W/2, ly + 55, 2, C.p1, 'center');
}

// ── Result screen ─────────────────────────────────────────────
function drawResult() {
  drawSky();
  drawWater(totalFrames);
  drawGround();

  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(W/2 - 300, 60, 600, 460);
  ctx.fillStyle = C.yellow;
  ctx.fillRect(W/2 - 300, 60, 600, 4);
  ctx.fillRect(W/2 - 300, 516, 600, 4);

  drawPixelText('GAME OVER', W/2, 80, 4, C.yellow, 'center');

  // Scores
  const p1 = players[0], p2 = players[1];
  drawPixelText('1P', W/2 - 200, 155, 3, C.p1, 'center');
  drawPixelText(String(p1.score), W/2 - 200, 185, 4, C.white, 'center');
  drawPixelText('MAX COMBO', W/2 - 200, 228, 2, '#aaa', 'center');
  drawPixelText('x' + p1.maxCombo, W/2 - 200, 248, 3, C.p1, 'center');

  drawPixelText('VS', W/2, 200, 3, C.yellow, 'center');

  drawPixelText('2P', W/2 + 200, 155, 3, C.p2, 'center');
  drawPixelText(String(p2.score), W/2 + 200, 185, 4, C.white, 'center');
  drawPixelText('MAX COMBO', W/2 + 200, 228, 2, '#aaa', 'center');
  drawPixelText('x' + p2.maxCombo, W/2 + 200, 248, 3, C.p2, 'center');

  // Winner
  ctx.fillStyle = 'rgba(255,220,0,0.15)';
  ctx.fillRect(W/2 - 250, 300, 500, 60);
  let winText, winColor;
  if (p1.score > p2.score) {
    winText = '1P WINS!'; winColor = C.p1;
  } else if (p2.score > p1.score) {
    winText = '2P WINS!'; winColor = C.p2;
  } else {
    winText = 'DRAW!'; winColor = C.yellow;
  }

  const flash = Math.floor(totalFrames / 10) % 2 === 0;
  drawPixelText(winText, W/2, 315, 4, flash ? winColor : C.white, 'center');

  // Restart
  if (Math.floor(totalFrames / 25) % 2 === 0) {
    drawPixelText('PRESS SPACE TO RETRY', W/2, 400, 2, C.green, 'center');
  }

  drawPixelText('1P: A/D MOVE  S FISH   2P: J/L MOVE  K FISH   SPACE TO RETRY', W/2, 445, 1, '#666', 'center');
}

// ── Countdown screen ──────────────────────────────────────────
let countdownFrame = 0;
const FRAMES_PER_COUNT = 60; // 1 second at 60fps

function drawCountdown() {
  drawSky();
  drawWater(totalFrames);
  drawGround();

  // Draw players ready
  for (const p of players) drawRod(p);

  // Dark overlay
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, W, H);

  // Countdown logic
  countdownFrame++;
  if (countdownFrame >= FRAMES_PER_COUNT) {
    countdownFrame = 0;
    game.countdown--;
    beep(game.countdown > 0 ? 440 : 880, 0.15, 'square', 0.2);
    if (game.countdown <= 0) {
      game.state = 'play';
      soundStart();
      spawnWave();
      return;
    }
  }

  const num = String(game.countdown);
  const progress = countdownFrame / FRAMES_PER_COUNT;
  const scale = 12 + Math.sin(progress * Math.PI) * 3;
  const flash = Math.floor(totalFrames / 5) % 2 === 0;
  drawPixelText(num, W/2, H/2 - 50, Math.floor(scale), flash ? C.yellow : C.white, 'center');

  // "READY" text
  drawPixelText('READY', W/2, H/2 + 80, 4, C.green, 'center');
}

// ── Game init & reset ─────────────────────────────────────────
function resetGame() {
  game.state = 'title';
  game.mode = '2p';
  creatures = [];
  crabs = [];
  players = [createPlayer(0), createPlayer(1)];
  elapsed = 0;
  waveFrame = 0;
  totalFrames = 0;
  initTitleFish();
}

function startGame(mode) {
  if (audio && audio.state === 'suspended') audio.resume();
  game.state = 'countdown';
  game.mode = mode || '2p';
  game.countdown = 3;
  countdownFrame = 0;
  creatures = [];
  crabs = [];
  crabs = [
    { x: Math.random() * W, y: WATER_TOP + 80, vx: Math.random() < 0.5 ? 0.8775 : -0.8775, alive: true, stunTimer: 0 },
    { x: Math.random() * W, y: WATER_TOP + 240, vx: Math.random() < 0.5 ? 0.8775 : -0.8775, alive: true, stunTimer: 0 },
    { x: Math.random() * W, y: WATER_TOP + 400, vx: Math.random() < 0.5 ? 0.8775 : -0.8775, alive: true, stunTimer: 0 },
    { x: Math.random() * W, y: GROUND_TOP - 60, vx: Math.random() < 0.5 ? 0.8775 : -0.8775, alive: true, stunTimer: 0 },
  ];
  players = [createPlayer(0), createPlayer(1)];
  elapsed = 0;
  waveFrame = 0;
  rubySpawnIndex = 0;
  maxCreatures = 15;
  // Initialize AI timer for 1P mode
  if (game.mode === '1p') resetAiTimer();
}

// ── Main loop ─────────────────────────────────────────────────
let lastTime = 0;
let dt = 0; // delta time in seconds (global for all updates)

function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  totalFrames++;

  pollGamepads();

  ctx.clearRect(0, 0, W, H);

  if (game.state === 'title') {
    drawTitle();
    return;
  }

  if (game.state === 'result') {
    drawResult();
    return;
  }

  if (game.state === 'countdown') {
    drawCountdown();
    return;
  }

  // ── PLAY ──
  elapsed += dt;
  const timeLeft = 90 - elapsed;

  if (timeLeft <= 0) {
    game.state = 'result';
    soundGameOver();
    return;
  }

  // Update max creatures based on elapsed time
  maxCreatures = Math.floor(10 + elapsed * 0.2);

  // Wave spawning
  waveFrame++;
  if (waveFrame >= waveInterval) {
    waveFrame = 0;
    spawnWave();
  }

  // Ruby spawning (timer-based)
  if (rubySpawnIndex < rubySpawnTimes.length && elapsed >= rubySpawnTimes[rubySpawnIndex]) {
    const ruby = createFish(rubySpawnX[rubySpawnIndex], GROUND_TOP - 10, 'ruby');
    ruby.vx = 0;  // no horizontal movement
    ruby.vy = 0;  // no vertical movement
    creatures.push(ruby);
    rubySpawnIndex++;
  }

  // ── Keyboard rod movement (continuous while held) ──
  {
    const p0 = players[0];
    if (p0.stunTimer <= 0) {
      if (keys['KeyA']) p0.rodX = Math.max(40,     p0.rodX - ROD_SPEED * dt);
      if (keys['KeyD']) p0.rodX = Math.min(W - 40, p0.rodX + ROD_SPEED * dt);
      // Touch movement (1P only)
      if (touchState.left) {
        p0.rodX = Math.max(40, p0.rodX - ROD_SPEED * dt);
      }
      if (touchState.right) {
        p0.rodX = Math.min(W - 40, p0.rodX + ROD_SPEED * dt);
      }
    }
  }
  if (game.mode === '2p') {
    const p1 = players[1];
    if (p1.stunTimer <= 0) {
      if (keys['KeyJ']) p1.rodX = Math.max(40,     p1.rodX - ROD_SPEED * dt);
      if (keys['KeyL']) p1.rodX = Math.min(W - 40, p1.rodX + ROD_SPEED * dt);
    }
  }

  // ── AI update (1P mode) ──
  if (game.mode === '1p') updateAI();

  // Update
  for (const p of players) {
    if (p.stunTimer <= 0) updateHook(p);
  }
  for (const p of players) {
    if (p.stunTimer > 0) p.stunTimer--;
  }
  updateCreatures();
  updateCrabs();
  checkCrabCutLines();

  // Draw background
  drawSky();
  drawWater(totalFrames);

  // Draw creatures (behind hooks)
  for (const f of creatures) drawFishCreature(f);

  // Draw crabs
  for (const c of crabs) drawCrab(c);

  // Draw rods & lines
  for (const p of players) {
    drawRod(p);
    drawHook(p);
  }

  drawGround();

  // Draw UI on top
  drawUI();

  // Combo flash
  for (const p of players) {
    if (p.caughtFish.length >= 3) {
      const tx = p.idx === 0 ? W/4 : 3*W/4;
      const flash = Math.floor(totalFrames / 8) % 2 === 0;
      if (flash) {
        drawPixelText('COMBO!', tx, 90, 3, C.yellow, 'center');
      }
    }
  }
}

// ── Boot ──────────────────────────────────────────────────────
resetGame();
requestAnimationFrame(ts => {
  lastTime = ts;
  requestAnimationFrame(gameLoop);
});
</script>
